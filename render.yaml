services:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend Web Service (FastAPI)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: crm-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        sync: false

# ───────────────────────────────────────────────────────────────────────────
# Managed PostgreSQL Database
# ─────────────────────────────────────────────────────────────────────────
databases:
  - name: crm-db
    databaseName: growthos
    user: postgres
    region: singapore
    plan: free
