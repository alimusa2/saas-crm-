services:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend Web Service (FastAPI) - Card-Free Blueprint
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: crm-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./growthos.db"
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: crm-frontend
          property: url

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend Static Site (Vite + React)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: crm-frontend
    env: static
    region: singapore
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: crm-backend
          property: url
          append: "/api/v1"
